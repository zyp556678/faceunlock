[package]
name = "faceunlock-gui"
version = "0.1.0"
description = "faceunlock 管理界面（人脸识别登录）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 该变量由 tauri-build 在编译期设置；这里显式声明避免 cargo 警告
custom-protocol = ["tauri/custom-protocol"]
