# faceunlock —— 让 polkit / pkexec 授权框里的人脸认证能访问摄像头
#
# 背景（Ubuntu 26.04 / polkit 127 起）：
#   polkit 把 polkit-agent-helper-1 —— 也就是 polkit-1 服务的 PAM 栈所在的
#   进程 —— 起成 systemd socket 激活的服务，并给它加了强沙箱：
#       PrivateDevices=yes          -> 私有 /dev，里面根本没有 /dev/video*
#       DevicePolicy=strict
#       DeviceAllow=/dev/null rw    -> 视频设备被设备 cgroup 拒绝
#   结果：pkexec（以及任何走 polkit 的图形授权框，比如管理界面要求提权时）
#   里的人脸认证**永远**打不开摄像头，日志里是
#       faceunlock: ... 无法打开 /dev/video0（被占用或无权限）
#   同时因为白等一次 OpenCV 导入 + 8 秒兜底超时，用户在授权框前既等不到
#   人脸通过、也来不及输入密码（README「Ubuntu 26.04 / polkit 127」一节）。
#
# 本 drop-in 只做两件事：
#   1. PrivateDevices=no                —— 让 /dev/video* 重新可见
#   2. DeviceAllow=char-video4linux rw  —— 设备 cgroup 里只放行 video4linux
#      设备名由 systemd 用 /proc/devices 解析（fnmatch），等价的数字写法是
#      char-81 rw；若不生效可用后者替换。
#
# 边界（刻意保持最小）：
#   * DevicePolicy=strict 依然生效：除了 /dev/null 与视频设备，别的设备
#     （磁盘、input、drm、tty…）照旧被设备 cgroup 拒绝；
#   * ProtectSystem=strict / ProtectHome=yes / PrivateTmp=yes /
#     PrivateNetwork=yes / NoNewPrivileges=yes / RestrictSUIDSGID=yes /
#     SystemCallFilter=@system-service / SystemCallArchitectures=native
#     全部保持原样；
#   * 只多给了"摄像头"这一项能力，没有多给文件系统或别的设备。
#
# 不想要这个能力（只要密码）就用：
#       sudo faceunlock polkit-camera off     # 删除本文件并 daemon-reload
# 或者手工 sudo rm 本文件后执行 systemctl daemon-reload。
[Service]
PrivateDevices=no
DeviceAllow=char-video4linux rw
